version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: etl_postgres_warehouse
    restart: always
    environment:
      POSTGRES_DB: analytics_warehouse
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql
    networks:
      - etl_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: etl_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@warehouse.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - etl_net

volumes:
  pgdata:

networks:
  etl_net:
    driver: bridge
